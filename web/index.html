<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Symmetry Rush - 밀고 돌려서 대칭을 완성하는 파스텔 퍼즐 러시">
  <meta name="theme-color" content="#FFF8F1">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Symmetry Rush">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Symmetry Rush</title>
  <style>
    html, body { margin: 0; height: 100%; background: linear-gradient(#FFF8F1, #F1EEFF); }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
    #loading span { width: 22px; height: 22px; border-radius: 7px; background: #FFC2D9; animation: bob 0.9s ease-in-out infinite; box-shadow: 0 6px 12px rgba(247,127,171,0.35); }
    #loading span:nth-child(2) { background: #BDE0FF; animation-delay: 0.15s; }
    #loading span:nth-child(3) { background: #AEEBD8; animation-delay: 0.3s; }
    @keyframes bob { 50% { transform: translateY(-14px); } }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading"><span></span><span></span><span></span></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // 첫 프레임이 그려지면 로딩 표시를 지운다.
    window.addEventListener("flutter-first-frame", function () {
      var el = document.getElementById("loading");
      if (el) el.remove();
    });
  </script>
</body>
</html>
