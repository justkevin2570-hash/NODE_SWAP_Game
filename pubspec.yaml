name: node_swap_game
description: "Symmetry Rush - 파스텔 대칭 퍼즐 러시"
publish_to: 'none'

version: 2.3.1+10

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_animate: ^4.5.2
  audioplayers: ^6.5.0
  shared_preferences: ^2.5.3
  clock: ^1.1.1
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  games_services: ^5.3.0
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/sfx/
    - assets/audio/music/

  fonts:
    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf
    # 수식(y = x 등)용. STIX Two 에서 필요한 글자만 남긴 것 (OFL, assets/fonts/OFL-STIXTwo.txt)
    - family: STIXTwoMath
      fonts:
        - asset: assets/fonts/STIXTwoMath-Regular.ttf
        - asset: assets/fonts/STIXTwoMath-Italic.ttf
          style: italic
