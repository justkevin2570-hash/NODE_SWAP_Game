name: node_swap_game
description: "Node Swap - 파스텔 대칭 퍼즐 러시"
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_animate: ^4.5.2
  audioplayers: ^6.5.0
  shared_preferences: ^2.5.3
  clock: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/sfx/
    - assets/audio/music/

  fonts:
    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf
